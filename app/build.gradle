plugins {
    id 'com.android.application'
}

// 读取 local.properties 中的签名配置（该文件与 *.jks 均不入库，见 .gitignore）
// 未配置时回退 debug 签名，保证克隆项目后仍可直接构建 release
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def keystoreFilePath = localProps.getProperty("keystore.file")

android {
    namespace 'com.kky.codescaner'
    compileSdk 37

    defaultConfig {
        applicationId "com.kky.codescaner"
        minSdk 23
        targetSdk 37
        versionCode 5
        versionName "1.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (keystoreFilePath != null) {
            release {
                storeFile rootProject.file(keystoreFilePath)
                storePassword localProps.getProperty("keystore.storePassword")
                keyAlias localProps.getProperty("keystore.keyAlias")
                keyPassword localProps.getProperty("keystore.keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            //正式签名（local.properties 配置）优先，未配置时回退 debug 签名
            signingConfig keystoreFilePath != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        // 启用 ViewBinding，替代已废弃的 ButterKnife
        viewBinding true
        // AboutActivity 中用到了 BuildConfig.VERSION_NAME
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation project(':zxing')
    // 相册图片 EXIF 方向读取（识别前摆正图片）
    implementation 'androidx.exifinterface:exifinterface:1.4.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
